services:
  postgres:
    image: postgres:17
    container_name: shop-postgres
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set the DB_PASSWORD environment variable}
    ports:
      - "5432:5432"
    volumes:
      - shop-pgdata:/var/lib/postgresql/data

volumes:
  shop-pgdata: