spring:
  application:
    name: shop
  datasource:
    url: jdbc:h2:mem:shopdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: false
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp
      
shop:
  currency: USD
  tax-rate: 0.10
  low-stock-threshold: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: "@project.artifactId@"
    version: "@project.version@"

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} : %msg%n"