spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shop}
    username: ${DB_USER:shop}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always
      data-locations: classpath:data-prod.sql
  h2:
    console:
      enabled: false

logging:
  level:
    root: INFO
    edu.itc.shop: INFO